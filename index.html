<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Білет за замовлення</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Russo+One&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="top">
  <div class="top-in">
    <div class="brand"><i aria-hidden="true"></i>Білет за замовлення</div>
    <div class="jp" title="Джекпот місяця"><small>Джекпот</small><b class="num" id="jpVal">—</b></div>
    <nav class="tabs" role="tablist" id="tabs" hidden>
      <button class="tab" role="tab" data-v="cab" aria-selected="true">Мій кабінет</button>
      <button class="tab" role="tab" data-v="rate" aria-selected="false">Рейтинг</button>
      <button class="tab" role="tab" data-v="adm" aria-selected="false" hidden id="admTab">Адмінка</button>
      <button class="logout" id="logout" type="button">Вийти</button>
    </nav>
  </div>
</header>
<main class="wrap">
  <section id="vLogin" hidden></section>
  <section id="vCab" hidden></section>
  <section id="vRate" hidden></section>
  <section id="vAdm" hidden></section>
</main>
<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
